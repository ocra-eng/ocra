<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <script>
      try {
        var t = localStorage.getItem("ocra-theme")
        if (t === "dark" || t === "light")
          document.documentElement.setAttribute("data-theme", t)
      } catch (e) {}
    </script>
    <link rel="icon" type="image/svg+xml" href="%BASE_URL%brand/green.svg" />
    <link
      rel="icon"
      type="image/svg+xml"
      href="%BASE_URL%brand/white.svg"
      media="(prefers-color-scheme: dark)"
    />
    <link rel="apple-touch-icon" href="%BASE_URL%apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="OCRA ÉIREANN is the national governing body for obstacle sport in Ireland — sanctioning races, setting the standards, and selecting the athletes who represent Ireland."
    />
    <title>OCRA ÉIREANN — National Governing Body for Obstacle Sport</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
