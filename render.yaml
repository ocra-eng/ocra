# Render blueprint for the OCRA monorepo.
#
# Three services from one repo — which is why we moved off GitHub Pages:
# Pages allows one site per repository, Render does not care.
#
# Dev is what exists today. Production services are added at cutover, when
# ocra.ie moves off WordPress and members.ocra.ie moves off Vercel; until
# then nothing here touches a live domain.
#
# Secrets are `sync: false` — set them in the Render dashboard, never here.

services:
  # ---------------------------------------------------------------- API
  - type: web
    name: ocra-api-dev
    runtime: node
    plan: free # sleeps when idle; the app's health gate covers the wake
    region: frankfurt # closest to the Supabase eu-west project
    # Migrations belong in preDeployCommand, but Render reserves that for
    # paid plans — so on free they run at the end of the build, before the
    # new instance starts serving. Safe while migrations stay additive;
    # move to preDeployCommand when this service goes paid.
    # --include=dev because NODE_ENV=production makes npm skip devDeps,
    # and TypeScript lives there. Migrations run from compiled JS so tsx
    # is not needed in production.
    buildCommand: >-
      npm ci --include=dev &&
      npm run build -w @ocra/shared &&
      npm run build -w @ocra/api &&
      npm run db:migrate:dist -w @ocra/api
    startCommand: npm run start -w @ocra/api
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      # dev: the API boots without Stripe and reports billing: "disabled".
      # Set to "production" on the prod service so missing keys are fatal.
      - key: APP_ENV
        value: dev
      - key: DATABASE_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      # Dashboard-set, not pinned here. These are the onrender.com URLs
      # until the .ocra.ie CNAMEs exist, and change again at cutover — a
      # value in this file would overwrite the working one on every sync.
      - key: MEMBERS_APP_URL
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false
      # Billing stays off until Stripe test keys are set; the API reports
      # billing: "disabled" rather than refusing to boot.
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: STRIPE_ATHLETE_PRICE_ID
        sync: false

  # ------------------------------------------------------------ members
  - type: web
    name: ocra-members-dev
    runtime: static
    buildCommand: npm ci --include=dev && npm run build -w @ocra/shared && npm run build -w @ocra/members
    staticPublishPath: apps/members/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      # Auth-gated app: keep it out of search results entirely.
      - path: /*
        name: X-Robots-Tag
        value: noindex
    envVars:
      # Dashboard-set for the same reason as the API's URLs. Note Vite
      # bakes this in at build time, so changing it needs a redeploy.
      - key: VITE_API_URL
        sync: false
      - key: VITE_SUPABASE_URL
        sync: false
      - key: VITE_SUPABASE_PUBLISHABLE_KEY
        sync: false

  # ---------------------------------------------------------- marketing
  - type: web
    name: ocra-marketing-dev
    runtime: static
    # Prerender drives a real browser, so the build installs one into the
    # puppeteer cache that scripts/prerender.mjs already searches.
    # The installer prints "chrome@<version> <absolute path>", so take the
    # path from its own output rather than guessing the layout. prerender
    # also searches .chrome/ as a fallback.
    buildCommand: >-
      npm ci --include=dev &&
      export CHROME_PATH=$(npx -y @puppeteer/browsers install chrome@stable --path "$PWD/.chrome" | cut -d' ' -f2-) &&
      npm run build &&
      npm run prerender
    staticPublishPath: apps/marketing/dist
    routes:
      # Prerendered locale routes are real files, so only unmatched paths
      # fall through to the SPA shell.
      - type: rewrite
        source: /*
        destination: /404.html
